#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
# Configuration cache is disabled here because the IDE (Android Studio / IntelliJ) Kotlin Gradle
# sync task `prepareKotlinBuildScriptModel` is incompatible with it on this toolchain (Gradle 9.4 /
# AGP 9.2 / Kotlin 2.4), which makes project sync fail with
# "Task 'prepareKotlinBuildScriptModel' not found in project ':server'".
# CLI builds can still opt in per-invocation with `--configuration-cache`.
# org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false