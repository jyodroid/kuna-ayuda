<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    display: flex; align-items: center; gap: 56px;
    padding: 0 80px;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(120% 140% at 15% 20%, #14727c 0%, #0F5E66 55%, #0a464c 100%);
    color: #ffffff;
  }
  .badge {
    width: 216px; height: 216px; flex: 0 0 216px;
    border-radius: 48px; background: #ffffff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 18px 50px rgba(0,0,0,0.28);
    overflow: hidden;
  }
  .badge img { width: 216px; height: 216px; object-fit: cover; }
  .text { display: flex; flex-direction: column; gap: 16px; }
  h1 { font-size: 78px; font-weight: 800; letter-spacing: -1px; line-height: 1; }
  .tagline { font-size: 30px; font-weight: 500; opacity: 0.95; }
  .chips { display: flex; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
  .chip {
    font-size: 22px; font-weight: 600;
    padding: 8px 18px; border-radius: 999px;
    background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.25);
  }
</style>
</head>
<body>
  <div class="badge"><img src="icon-512.png" alt="" /></div>
  <div class="text">
    <h1>Kuna Ayuda</h1>
    <div class="tagline">Red de ayuda ante desastres</div>
    <div class="chips">
      <span class="chip">Sismos</span>
      <span class="chip">Incendios</span>
      <span class="chip">Puntos de ayuda</span>
      <span class="chip">SOS sin conexión</span>
    </div>
  </div>
</body>
</html>
