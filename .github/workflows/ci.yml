name: CI

# Runs on every push to main AND every PR targeting main. The PR run is the guardrail: enable branch
# protection on `main` requiring these checks, then merge through PRs (even solo) so a red build can't
# land. See CONTRIBUTING / the repo's branch-protection settings.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref cancels the in-flight run — saves CI minutes on rapid pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests + shared-client compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Runs the whole unit-test suite (core:domain, core:data, core:beacon, server — all Docker-free)
      # and compiles the shared Compose client for the JVM target, which force-compiles commonMain +
      # jvmMain and catches most shared-code breakage without needing the Android SDK / a macOS runner.
      - name: Run tests
        run: >
          ./gradlew --no-daemon --stacktrace
          :core:domain:jvmTest
          :core:data:jvmTest
          :core:beacon:jvmTest
          :server:test
          :composeApp:compileKotlinJvm

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # On pull_request runs, gitleaks-action lists the PR's commits via the API, which needs
    # pull-requests:read — the default GITHUB_TOKEN lacks it and returns 403. Grant it explicitly.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so a secret in any commit is caught, not just the diff
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required for GitHub *organizations*; not needed for a personal repo.

  package:
    name: Build landing + console + server fat jar
    runs-on: ubuntu-latest
    needs: test # only package once the tests are green
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node 22 (for the Vite landing + console builds)
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            landing/package-lock.json
            console/package-lock.json

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # SEPARATE Gradle invocations on purpose: buildLanding/buildConsole write into
      # server/src/main/resources/{web,console}, which is processResources' input dir. If they ran in one
      # invocation with shadowJar, Gradle 9 fails with an implicit-dependency validation error. Neither is
      # wired into processResources (so Heroku's Node-less build packages the committed dirs as-is), so we
      # sequence them here: regenerate web/ + console/, then package them into the fat jar.
      - name: Build landing site
        run: ./gradlew --no-daemon --stacktrace :server:buildLanding

      - name: Build moderator console
        run: ./gradlew --no-daemon --stacktrace :server:buildConsole

      - name: Build server fat jar (landing + console bundled)
        run: ./gradlew --no-daemon --stacktrace :server:shadowJar

      - name: Upload server fat jar (landing + console bundled)
        uses: actions/upload-artifact@v5
        with:
          name: server-fatjar
          path: server/build/libs/server*all.jar
          if-no-files-found: error

  deploy:
    name: Deploy to Heroku
    runs-on: ubuntu-latest
    # Only on a green main push: waits for tests, the secret scan, AND a clean package build. Never on
    # PRs or feature branches. Requires the HEROKU_API_KEY repo secret (see below); if it's absent the
    # step still runs but fails loudly — that's the signal to add the secret.
    needs: [test, secret-scan, package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Heroku's buildpack deploy is a git push — it needs the full history

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17', cache: gradle }

      - name: Set up Node 22 (to build landing + console for the deploy)
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            landing/package-lock.json
            console/package-lock.json

      # Rebuild the Vite landing + the React moderator console INTO the server resources so the deployed
      # jar always serves the current sources — Heroku's JVM buildpack has no Node and can't build them.
      # We commit the generated dirs LOCALLY only; that commit is pushed to Heroku's git (never to
      # origin/main), so you never have to commit the built web/ + console/ bundles by hand.
      - name: Build landing + console into server resources
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :server:buildLanding
          ./gradlew --no-daemon --stacktrace :server:buildConsole

      # Deploys by pushing to Heroku's git endpoint with an API-key credential (no third-party action;
      # the token comes from the secret and is never echoed). Heroku then runs `./gradlew stage` and
      # boots the fat jar via the root Procfile. -f because Heroku's git branch is just a deploy trigger.
      - name: Push to Heroku (with freshly built web assets)
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP: kuna-ayuda
        run: |
          if [ -z "$HEROKU_API_KEY" ]; then
            echo "::error::HEROKU_API_KEY secret is not set — add it in repo Settings → Secrets → Actions."
            exit 1
          fi
          git config user.email "ci@kuna-ayuda.local"
          git config user.name "kuna-ci"
          git add -f server/src/main/resources/web server/src/main/resources/console
          git commit -m "ci: build landing + console for Heroku deploy" || echo "No asset changes to commit."
          git config http.postBuffer 524288000
          git push -f "https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP}.git" HEAD:refs/heads/main
