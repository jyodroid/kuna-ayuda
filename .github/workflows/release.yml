name: Release

# Cut a release by pushing a version tag, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
# This builds the native desktop installers (macOS .dmg, Windows .msi, Linux .deb) AND the server fat
# jar (with the landing bundled), renames each to a STABLE, version-less name, and attaches them to the
# GitHub Release for that tag. The stable names matter: the landing page links to
#   https://github.com/<owner>/kuna-ayuda/releases/latest/download/<stable-name>
# which always resolves to the latest release's asset — so the download links never need updating.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the Release and upload assets

jobs:
  # Fast correctness gate before we spend minutes on 3-OS installer builds.
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Guard against version drift: the pushed tag (vX.Y.Z) must match desktopPackageVersion in the
      # version catalog, which drives the installer version AND the in-app AppInfo.VERSION. If they
      # disagree, abort the whole release before anything is built or published.
      - name: Verify tag matches desktopPackageVersion
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CATALOG_VERSION="$(sed -nE 's/^desktopPackageVersion[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' gradle/libs.versions.toml)"
          echo "tag=$TAG_VERSION  catalog=$CATALOG_VERSION"
          if [ -z "$CATALOG_VERSION" ]; then
            echo "::error::Could not read desktopPackageVersion from gradle/libs.versions.toml"; exit 1
          fi
          if [ "$TAG_VERSION" != "$CATALOG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match desktopPackageVersion $CATALOG_VERSION — bump the catalog (and AppInfo/installer follow it) or retag."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - run: chmod +x ./gradlew
      - run: >
          ./gradlew --no-daemon --stacktrace
          :core:domain:jvmTest :core:data:jvmTest :core:beacon:jvmTest :server:test

  # Native desktop installer, one per OS. fail-fast:false so a flaky Windows/msi build can't sink the
  # macOS + Linux + server release — whatever built gets attached.
  desktop:
    name: Desktop installer (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            task: packageDmg
            glob: composeApp/build/compose/binaries/main/dmg/*.dmg
            asset: Kuna-Ayuda-macOS.dmg
          - os: ubuntu-latest
            task: packageDeb
            glob: composeApp/build/compose/binaries/main/deb/*.deb
            asset: Kuna-Ayuda-Linux.deb
          - os: windows-latest
            task: packageMsi
            glob: composeApp/build/compose/binaries/main/msi/*.msi
            asset: Kuna-Ayuda-Windows.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }

      # jpackage prerequisites the base runner image may lack.
      - name: Install .deb tooling (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y fakeroot binutils

      - name: Install WiX Toolset (Windows, for .msi)
        if: matrix.os == 'windows-latest'
        run: choco install wixtoolset --no-progress -y

      - name: Build installer
        shell: bash
        run: |
          chmod +x ./gradlew || true
          ./gradlew --no-daemon --stacktrace :composeApp:${{ matrix.task }}

      - name: Collect + rename to a stable name
        shell: bash
        run: |
          mkdir -p dist
          f="$(ls ${{ matrix.glob }} | head -n1)"
          echo "Packaged: $f -> ${{ matrix.asset }}"
          cp "$f" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  # Server fat jar (landing bundled) — same artifact the deploy path ships.
  server:
    name: Server fat jar
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: chmod +x ./gradlew
      # Separate invocations (buildLanding writes into processResources' input dir — see ci.yml note).
      - run: ./gradlew --no-daemon --stacktrace :server:buildLanding
      - run: ./gradlew --no-daemon --stacktrace :server:shadowJar
      - uses: actions/upload-artifact@v4
        with:
          name: server-fatjar
          path: server/build/libs/server*all.jar
          if-no-files-found: error

  # Gather every built artifact and publish the Release.
  release:
    name: Publish GitHub Release
    needs: [desktop, server]
    if: always() && needs.server.result == 'success' # server jar is the floor; installers are best-effort
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts # each artifact lands in artifacts/<name>/...
      - name: List gathered artifacts
        run: find artifacts -type f -print
      - name: Create/Update the Release with all assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*.deb
            artifacts/**/server*all.jar
          generate_release_notes: true
          fail_on_unmatched_files: false # tolerate a missing installer (e.g. a failed Windows leg)
