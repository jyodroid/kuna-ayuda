name: Release

# Two ways to cut a release — both produce the same GitHub Release with stable, version-less asset names
# (macOS .dmg, Windows .msi, Linux .deb, server fat jar). The landing page links to
#   https://github.com/<owner>/kuna-ayuda/releases/latest/download/<stable-name>
# so the download links never need updating once a release exists.
#
#  1. AUTOMATIC (recommended): bump `desktopPackageVersion` in gradle/libs.versions.toml and push to main.
#     The `check` job notices the version has no matching `vX.Y.Z` tag yet and cuts the release, creating
#     the tag itself — so version bump + release stay consistent with no manual tagging.
#  2. MANUAL: `git tag vX.Y.Z && git push origin vX.Y.Z` (the tag must match desktopPackageVersion).
#
# Note: this covers the DESKTOP installers + SERVER jar only. Android (Play) and iOS (TestFlight) are
# separate manual uploads that need signing/store credentials and review.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write # create the tag + Release and upload assets

jobs:
  # Decide whether this push should release, and at what version. On a tag push it always releases (and
  # verifies the tag matches the catalog). On a main push it releases only when desktopPackageVersion has
  # no existing vX.Y.Z tag yet — i.e. the version was just bumped — so ordinary commits do nothing.
  check:
    name: Decide release
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 } # need full tag history to know what's already released
      - id: decide
        run: |
          VERSION="$(sed -nE 's/^desktopPackageVersion[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' gradle/libs.versions.toml)"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read desktopPackageVersion from gradle/libs.versions.toml"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "::error::Tag v$TAG_VERSION does not match desktopPackageVersion $VERSION — bump the catalog or retag."
              exit 1
            fi
            echo "Tag push for v$VERSION — releasing."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already tagged/released — nothing to do."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version v$VERSION detected on main — will build and release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  # Fast correctness gate before we spend minutes on 3-OS installer builds.
  test:
    name: Tests
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - run: chmod +x ./gradlew
      - run: >
          ./gradlew --no-daemon --stacktrace
          :core:domain:jvmTest :core:data:jvmTest :core:beacon:jvmTest :server:test

  # Native desktop installer, one per OS. fail-fast:false so a flaky Windows/msi build can't sink the
  # macOS + Linux + server release — whatever built gets attached.
  desktop:
    name: Desktop installer (${{ matrix.os }})
    needs: [check, test]
    if: needs.check.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            task: packageDmg
            glob: composeApp/build/compose/binaries/main/dmg/*.dmg
            asset: Kuna-Ayuda-macOS.dmg
          - os: ubuntu-latest
            task: packageDeb
            glob: composeApp/build/compose/binaries/main/deb/*.deb
            asset: Kuna-Ayuda-Linux.deb
          - os: windows-latest
            task: packageMsi
            glob: composeApp/build/compose/binaries/main/msi/*.msi
            asset: Kuna-Ayuda-Windows.msi
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # a hung leg can't stall the release for hours
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17', cache: gradle }

      # jpackage's .deb build needs fakeroot (+ binutils). Both are normally already on the runner, so
      # try installing from the existing cache first (fast, no network); only fall back to `apt-get
      # update` if that fails. The step is capped so a flaky apt mirror can't hang for many minutes.
      - name: Install .deb tooling (Linux)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 5
        run: |
          sudo apt-get install -y --no-install-recommends fakeroot binutils \
            || { sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot binutils; }

      - name: Install WiX Toolset (Windows, for .msi)
        if: matrix.os == 'windows-latest'
        run: choco install wixtoolset --no-progress -y

      - name: Build installer
        shell: bash
        run: |
          chmod +x ./gradlew || true
          ./gradlew --no-daemon --stacktrace :composeApp:${{ matrix.task }}

      - name: Collect + rename to a stable name
        shell: bash
        run: |
          mkdir -p dist
          f="$(ls ${{ matrix.glob }} | head -n1)"
          echo "Packaged: $f -> ${{ matrix.asset }}"
          cp "$f" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v5
        with:
          name: installer-${{ matrix.os }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  # Server fat jar (landing bundled) — same artifact the deploy path ships.
  server:
    name: Server fat jar
    needs: [check, test]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            landing/package-lock.json
            console/package-lock.json
      - run: chmod +x ./gradlew
      # Separate invocations (buildLanding/buildConsole write into processResources' input dir — see ci.yml note).
      - run: ./gradlew --no-daemon --stacktrace :server:buildLanding
      - run: ./gradlew --no-daemon --stacktrace :server:buildConsole
      - run: ./gradlew --no-daemon --stacktrace :server:shadowJar
      - uses: actions/upload-artifact@v5
        with:
          name: server-fatjar
          path: server/build/libs/server*all.jar
          if-no-files-found: error

  # Gather every built artifact and publish the Release. On a main push this also CREATES the tag
  # `v<version>` (via tag_name) — so the version bump and the tag stay in lockstep automatically.
  release:
    name: Publish GitHub Release
    needs: [check, desktop, server]
    # server jar is the floor; installers are best-effort. Guard on should_release so a normal main push
    # (no version bump) never publishes.
    if: always() && needs.check.outputs.should_release == 'true' && needs.server.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts # each artifact lands in artifacts/<name>/...
      - name: List gathered artifacts
        run: find artifacts -type f -print
      - name: Create/Update the Release with all assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }} # creates the tag on a main push; matches it on a tag push
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*.deb
            artifacts/**/server*all.jar
          generate_release_notes: true
          fail_on_unmatched_files: false # tolerate a missing installer (e.g. a failed Windows leg)
